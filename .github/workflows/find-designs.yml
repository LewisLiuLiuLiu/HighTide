name: Find New Designs

on:
  workflow_dispatch:
  # Disabled to save LLM token costs — re-enable by uncommenting:
  # schedule:
  #   - cron: "0 9 * * 1"  # Every Monday at 9 AM

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  find-designs:
    # Disabled to save LLM token costs — restore the fork-guard below to re-enable:
    #   if: ${{ github.repository == 'VLSIDA/HighTide' }}
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/find-designs"
          claude_args: "--max-turns 10"
